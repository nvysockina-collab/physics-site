<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Теория по физике</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #1f2937;
               background: linear-gradient(135deg, #eef2ff, #f0fdfa); padding: 40px 20px; }
        .wrap { max-width: 1000px; margin: 0 auto; }
        .back { display: inline-block; margin-bottom: 24px; color: #4338ca; text-decoration: none; font-weight: 600; }
        .back:hover { text-decoration: underline; }
        h1 { font-size: clamp(28px, 4vw, 42px); color: #312e81; margin-bottom: 8px; text-align: center; }
        .subtitle { text-align: center; color: #4b5563; margin-bottom: 40px; font-size: 17px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
        .card { display: flex; flex-direction: column; background: #fff; border-radius: 18px; padding: 28px 24px;
                text-decoration: none; color: inherit; box-shadow: 0 8px 22px rgba(30,41,59,.10);
                border-top: 6px solid var(--c, #6366f1); transition: transform .25s, box-shadow .25s; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 16px 32px rgba(30,41,59,.18); }
        .card .icon { font-size: 44px; margin-bottom: 12px; }
        .card h2 { font-size: 22px; margin-bottom: 8px; color: #111827; }
        .card p { color: #6b7280; font-size: 15px; line-height: 1.5; flex: 1; }
        .card .go { margin-top: 18px; font-weight: 600; color: var(--c, #6366f1); }
        .pdf { display: inline-block; margin-left: 8px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; vertical-align: middle; color: #fff; background: var(--c, #6366f1); }
        .text { background: #fff; border-radius: 18px; padding: 28px; margin-top: 30px; line-height: 1.7;
                box-shadow: 0 8px 22px rgba(30,41,59,.08); }
        .text h3 { margin-bottom: 10px; color: #312e81; }
        .text ul { padding-left: 22px; }
        button.card { font: inherit; text-align: left; cursor: pointer; width: 100%;
                      border-left: 0; border-right: 0; border-bottom: 0; }

        /* Окно просмотра PDF */
        .viewer { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, .75);
                  padding: 20px; align-items: center; justify-content: center; }
        .viewer.open { display: flex; }
        .viewer-box { width: 100%; max-width: 1000px; height: 100%; background: #fff; border-radius: 18px;
                      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
        .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                       padding: 12px 18px; background: #eef2ff; }
        .viewer-head h2 { font-size: 18px; color: #312e81; }
        .viewer-close { border: 0; background: #4338ca; color: #fff; font: inherit; font-weight: 600;
                        padding: 8px 16px; border-radius: 999px; cursor: pointer; }
        .viewer-close:hover { background: #312e81; }
        .viewer iframe { flex: 1; width: 100%; border: 0; }
        .viewer-hint { padding: 8px 18px; font-size: 14px; text-align: center; background: #fef9c3; }
        .viewer-hint a { color: #4338ca; font-weight: 600; }
    </style>
</head>
<body>
<div class="wrap">
    <a class="back" href="../index.html">← На главную</a>
    <h1>📚 Теория</h1>
    <p class="subtitle">Конспекты по основным темам</p>
    <div class="grid">
        <button type="button" class="card" style="--c:#8b5cf6" data-pdf="mkt-teoriya.pdf">
            <span class="icon">🧪</span>
            <h2>МКТ <span class="pdf">📄 PDF</span></h2>
            <p>Строение вещества, движение молекул, основное уравнение МКТ.</p>
            <span class="go">Читать 👁</span>
        </button>
        <button type="button" class="card" style="--c:#ef4444" data-pdf="dinamika-teoriya.pdf">
            <span class="icon">⚖️</span>
            <h2>Динамика <span class="pdf">📄 PDF</span></h2>
            <p>Законы Ньютона и силы в механике.</p>
            <span class="go">Читать 👁</span>
        </button>
        <button type="button" class="card" style="--c:#0ea5e9" data-pdf="zakon-oma.pdf">
            <span class="icon">🔌</span>
            <h2>Закон Ома <span class="pdf">📄 PDF</span></h2>
            <p>Сила тока, напряжение, сопротивление и их связь.</p>
            <span class="go">Читать 👁</span>
        </button>
        <button type="button" class="card" style="--c:#10b981" data-pdf="statika-teoriya.pdf">
            <span class="icon">🏗️</span>
            <h2>Статика <span class="pdf">📄 PDF</span></h2>
            <p>Равновесие тел, момент силы, правило рычага.</p>
            <span class="go">Читать 👁</span>
        </button>
    </div>
</div>

<!-- Окно просмотра PDF (без кнопки «Скачать») -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-box">
        <div class="viewer-head">
            <h2 id="viewer-title">Конспект</h2>
            <button type="button" class="viewer-close" id="viewer-close">✕ Закрыть</button>
        </div>
        <p class="viewer-hint">
            <a id="viewer-fallback" href="#" target="_blank" rel="noopener">Если конспект не отображается, нажмите сюда, чтобы открыть его в новой вкладке</a>
        </p>
        <iframe id="viewer-frame" title="Просмотр конспекта"></iframe>
    </div>
</div>

<script>
    (function () {
        var viewer = document.getElementById('viewer');
        var frame  = document.getElementById('viewer-frame');
        var title  = document.getElementById('viewer-title');
        var fallback = document.getElementById('viewer-fallback');

        function open(card) {
            // #toolbar=0 — скрыть панель встроенного просмотрщика (там кнопки «Скачать» и «Печать»)
            frame.src = card.getAttribute('data-pdf') + '#toolbar=0&navpanes=0';
            fallback.href = card.getAttribute('data-pdf');
            title.textContent = card.querySelector('h2').firstChild.textContent.trim();
            viewer.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        var cards = document.querySelectorAll('[data-pdf]');
        cards.forEach(function (card) {
            card.addEventListener('click', function () { open(card); });
        });

        // Ссылка вида index.html?file=mkt-teoriya.pdf сразу открывает нужный конспект.
        // Открываются только файлы, для которых есть карточка на этой странице.
        var wanted = new URLSearchParams(window.location.search).get('file');
        if (wanted) {
            cards.forEach(function (card) {
                if (card.getAttribute('data-pdf') === wanted) open(card);
            });
        }

        function close() {
            viewer.classList.remove('open');
            frame.src = 'about:blank';
            document.body.style.overflow = '';
        }
        document.getElementById('viewer-close').addEventListener('click', close);
        viewer.addEventListener('click', function (e) { if (e.target === viewer) close(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
</script>
</body>
</html>
