<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мультфильм «Как Архимед посрамил царя Гравитона» — Физика в сказках</title>
<meta name="description" content="Мультфильм по сказке Надежды Высочкиной о силе Архимеда: почему корабль не тонет и почему летает воздушный шар.">
<style>
:root{
  --ink:#312e81; --ink-soft:#4338ca; --indigo:#6366f1;
  --paper:#eef2ff; --gold:#f59e0b; --pink:#ec4899; --pink-deep:#be185d;
  --line:#c7d2fe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink);
  background:linear-gradient(135deg,#eef2ff,#f0fdfa); min-height:100vh;
  padding:18px 14px 40px;
}
.wrap{max-width:1000px;margin:0 auto}
header{text-align:center;margin-bottom:14px}
h1{font-size:clamp(19px,3.4vw,29px);margin:0 0 4px;line-height:1.25}
.sub{color:var(--ink-soft);font-size:14px;margin:0}
.stage{
  position:relative;border-radius:20px;overflow:hidden;background:#0b1020;
  box-shadow:0 16px 40px rgba(49,46,129,.22); aspect-ratio:16/9;
}
.stage svg{display:block;width:100%;height:100%}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;pointer-events:none}
.scene.on{opacity:1}
.caption{
  position:absolute;left:0;right:0;bottom:0;padding:10px 18px 14px;
  background:linear-gradient(to top,rgba(8,10,30,.86),rgba(8,10,30,0));
  color:#fff;font-size:clamp(12px,1.72vw,18px);line-height:1.35;text-align:center;
  min-height:52px;display:flex;align-items:flex-end;justify-content:center;
  text-shadow:0 2px 8px rgba(0,0,0,.85);transition:opacity .25s;
}
.controls{
  margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  justify-content:center;
}
button{
  font:inherit;font-weight:600;color:#fff;background:var(--indigo);border:0;
  border-radius:999px;padding:11px 22px;cursor:pointer;
  box-shadow:0 6px 16px rgba(99,102,241,.35);transition:transform .12s,filter .12s;
}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px)}
button.ghost{background:#fff;color:var(--ink-soft);box-shadow:0 4px 12px rgba(49,46,129,.14)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.counter{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:14px;
  min-width:74px;text-align:center}
.progress{height:6px;border-radius:999px;background:#dbe4ff;overflow:hidden;margin-top:12px}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#ec4899);
  transition:width .35s ease}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;background:#c7d2fe;
  box-shadow:none;border:0}
.dots button.on{background:var(--indigo);transform:scale(1.35)}
.dots button.seen{background:#a5b4fc}
footer{margin-top:22px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.6}
footer a{color:var(--indigo)}
.note{margin-top:10px;font-size:12.5px;color:#6366f1}
@media (prefers-reduced-motion:reduce){
  .scene{transition:none}
  .stage svg *{animation:none !important}
}

@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-120px);opacity:0}}
@keyframes sway{0%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}100%{transform:rotate(-2.5deg)}}
@keyframes swim{0%{transform:translateX(0)}50%{transform:translateX(34px)}100%{transform:translateX(0)}}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@keyframes glow{0%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:.85}}
.scene .drift{animation:drift 9s ease-in-out infinite}
.scene .rise{animation:rise 5.5s linear infinite}
.scene .sway{animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
.scene .swim{animation:swim 7s ease-in-out infinite}
</style>

"2.4" fill="none" opacity=".55"/><path d="M-146 42 Q0 50 146 42" stroke="#94a3b8" stroke-width="2.4" fill="none" opacity=".55"/><rect x="-105" y="30" width="18" height="18" rx="4" fill="#1e293b"/><rect x="-69" y="30" width="18" height="18" rx="4" fill="#1e293b"/><rect x="51" y="30" width="18" height="18" rx="4" fill="#1e293b"/><rect x="87" y="30" width="18" height="18" rx="4" fill="#1e293b"/><rect x="-120" y="-16" width="240" height="18" rx="6" fill="#94a3b8"/><rect x="-60" y="-210" width="7" height="200" fill="#78350f"/><rect x="52" y="-170" width="7" height="160" fill="#78350f"/><path d="M-56 -206 Q30 -190 44 -140 L-56 -140 Z" fill="#ffffff" stroke="#dbe4ff" stroke-width="3"/><path d="M-56 -132 Q34 -120 40 -86 L-56 -86 Z" fill="#ffffff" stroke="#dbe4ff" stroke-width="3"/><path d="M56 -166 Q118 -152 126 -116 L56 -116 Z" fill="#ffffff" stroke="#dbe4ff" stroke-width="3"/><path d="M-56 -140 L-56 -86" stroke="#dbe4ff" stroke-width="2"/><path d="M-56 -210 L-6 -220 L-56 -232 Z" fill="#ec4899"/></g><rect x="430" y="225" width="420" height="150" rx="22" fill="#ffffff" opacity="0.92"/><rect x="430" y="225" width="420" height="150" rx="22" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="640" y="322.4" font-family="Segoe UI" font-size="64" font-weight="600" fill="#4338ca" text-anchor="middle">КОНЕЦ</text><text x="640" y="660" font-family="Segoe UI" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">Сказка о царевиче Архимеде и царе Гравитоне</text></svg></div>

<script>
const SCENES = [{"n": 1, "key": "title", "audio": "audio/scene-01.mp3", "dur": 5.7, "phrases": [{"t": 0.24, "d": 5.245, "w": "Сказка о том, как царевич Архимед посрамил царя Гравитона."}]}, {"n": 2, "key": "gidros", "audio": "audio/scene-02.mp3", "dur": 10.29, "phrases": [{"t": 0.24, "d": 5.476, "w": "В подводном царстве, в тридевятом море, жил могучий царь Гидрос."}, {"t": 5.666, "d": 4.361, "w": "Владел он всеми водами — от лужи до океана."}]}, {"n": 3, "key": "aeriy", "audio": "audio/scene-03.mp3", "dur": 6.88, "phrases": [{"t": 0.24, "d": 6.427, "w": "А над ним, в небесных высях, правил царь Аэрий — повелитель ветров и облаков."}]}, {"n": 4, "key": "graviton", "audio": "audio/scene-04.mp3", "dur": 18.62, "phrases": [{"t": 0.24, "d": 6.508, "w": "И была у них общая беда: назойливый царь Гравитон, владыка всеобщего притяжения."}, {"t": 6.698, "d": 6.698, "w": "Он норовил всё утянуть книзу — корабли ко дну, птиц на землю, а облака прямо в грязь."}, {"t": 13.397, "d": 2.527, "w": "Всё под мою власть!"}, {"t": 15.924, "d": 2.418, "w": "гремел Гравитон."}]}, {"n": 5, "key": "sozyv", "audio": "audio/scene-05.mp3", "dur": 15.59, "phrases": [{"t": 0.24, "d": 4.687, "w": "Но цари Гидрос и Аэрий не стерпели такого самоуправства."}, {"t": 4.877, "d": 3.546, "w": "Созвали они мудрецов со всего света."}, {"t": 8.424, "d": 6.889, "w": "Первым явился старый дед Архимед из Сиракуз — лысый, с пружинкой и с ванной под мышкой."}]}, {"n": 6, "key": "zakon", "audio": "audio/scene-06.mp3", "dur": 13.48, "phrases": [{"t": 0.24, "d": 4.266, "w": "Эх, ваши величества, — сказал Архимед."}, {"t": 4.456, "d": 8.764, "w": "Любое тело, погружённое в жидкость или газ, теряет в весе ровно столько, сколько весит вытесненная им вода или воздух!"}]}, {"n": 7, "key": "evrika", "audio": "audio/scene-07.mp3", "dur": 12.54, "phrases": [{"t": 0.24, "d": 4.185, "w": "И для наглядности залез прямо в царскую купальню."}, {"t": 4.375, "d": 4.932, "w": "Вода хлынула через край, а Архимед закричал: «Эврика!»"}, {"t": 9.307, "d": 2.976, "w": "и выскочил нагишом во дворец."}]}, {"n": 8, "key": "korabl-zakon", "audio": "audio/scene-08.mp3", "dur": 11.42, "phrases": [{"t": 0.24, "d": 5.136, "w": "Смотрите: железный корабль тяжёл, но внутри он пустой."}, {"t": 5.326, "d": 5.815, "w": "Он вытесняет столько воды, что вода толкает его вверх с Архимедовой силой."}]}, {"n": 9, "key": "karavella", "audio": "audio/scene-09.mp3", "dur": 16.5, "phrases": [{"t": 0.24, "d": 5.245, "w": "Царь Гидрос хлопнул трезубцем: позвать каравеллу «Быстрая»!"}, {"t": 5.435, "d": 6.562, "w": "Приплыла каравелла: железная, с пушками, а держится на воде, словно утица."}, {"t": 11.997, "d": 4.239, "w": "Гравитон дует, тянет её ко дну — да куда там!"}]}, {"n": 10, "key": "aeriy-vopros", "audio": "audio/scene-10.mp3", "dur": 10.07, "phrases": [{"t": 0.24, "d": 2.187, "w": "А что в небе?"}, {"t": 2.377, "d": 2.921, "w": "спросил царь Аэрий."}, {"t": 5.299, "d": 4.511, "w": "У нас шары воздушные летают, да только не пойму — как?"}]}, {"n": 11, "key": "sharli", "audio": "audio/scene-11.mp3", "dur": 15.21, "phrases": [{"t": 0.24, "d": 6.807, "w": "Тут выступил юный воздухоплаватель Шарли — легкомысленный, как гелий, в шляпе-колпаке."}, {"t": 6.997, "d": 3.057, "w": "Надуваю шар тёплым дымом."}, {"t": 10.054, "d": 4.878, "w": "Он вытесняет много воздуха, а воздух толкает его вверх!"}]}, {"n": 12, "key": "polet", "audio": "audio/scene-12.mp3", "dur": 11.75, "phrases": [{"t": 0.24, "d": 5.543, "w": "И правда: затрепетал шар, натянул верёвки, да как рванётся ввысь!"}, {"t": 5.733, "d": 5.761, "w": "Гравитон аж за голову схватился — а шар летит себе, ветра обгоняет."}]}, {"n": 13, "key": "sovet", "audio": "audio/scene-13.mp3", "dur": 14.2, "phrases": [{"t": 0.24, "d": 3.125, "w": "Собрались три царя на совет."}, {"t": 3.315, "d": 6.549, "w": "Ну что ж, — буркнул Гравитон, — признаю: есть сила, которая меня ослушается."}, {"t": 9.864, "d": 4.076, "w": "Имя ей — выталкивающая сила Архимеда."}]}, {"n": 14, "key": "morale", "audio": "audio/scene-14.mp3", "dur": 13.36, "phrases": [{"t": 0.24, "d": 6.997, "w": "Не зная Архимеда — ни плавать, ни летать: тяжелее воды — на дно идти опять»."}, {"t": 7.187, "d": 5.897, "w": "А кто эту сказку запомнит — тот ни корабль не утопит, ни шар не перегрузит."}]}, {"n": 15, "key": "fin", "audio": "audio/scene-15.mp3", "dur": 5.99, "phrases": [{"t": 0.24, "d": 2.908, "w": "И Гравитон ему не страшен."}, {"t": 3.098, "d": 2.622, "w": "Вот и сказке конец!"}]}];
const scenes  = [...document.querySelectorAll('.scene')];
const capEl   = document.getElementById('caption');
const barEl   = document.getElementById('bar');
const cntEl   = document.getElementById('counter');
const dotsEl  = document.getElementById('dots');
const btnPlay = document.getElementById('play');
const btnPrev = document.getElementById('prev');
const btnNext = document.getElementById('next');
const btnSnd  = document.getElementById('sound');

let i = 0, playing = false, timer = null, capTimer = [], muted = false;
let audio = null;

SCENES.forEach((s, k) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role','tab');
  b.setAttribute('aria-label', 'Сцена ' + s.n);
  b.addEventListener('click', () => { stopPlay(); show(k); });
  dotsEl.appendChild(b);
});
const dots = [...dotsEl.children];

function clearCap() { capTimer.forEach(clearTimeout); capTimer = []; }

function showCaption(idx, phrases) {
  clearCap();
  if (!phrases.length) { capEl.textContent = ''; return; }
  const t0 = performance.now();
  phrases.forEach((p, k) => {
    capTimer.push(setTimeout(() => {
      capEl.style.opacity = '1';
      capEl.textContent = p.w;
    }, Math.max(0, p.t * 1000)));
  });
}

function show(k) {
  i = Math.max(0, Math.min(SCENES.length - 1, k));
  scenes.forEach((el, n) => el.classList.toggle('on', n === i));
  dots.forEach((d, n) => {
    d.classList.toggle('on', n === i);
    d.classList.toggle('seen', n < i);
    d.setAttribute('aria-selected', n === i);
  });
  cntEl.textContent = (i + 1) + ' / ' + SCENES.length;
  barEl.style.width = ((i + 1) / SCENES.length * 100) + '%';
  btnPrev.disabled = i === 0;
  btnNext.disabled = i === SCENES.length - 1;
  showCaption(i, SCENES[i].phrases);
}

function stopPlay() {
  playing = false;
  clearTimeout(timer);
  if (audio) { audio.pause(); }
  btnPlay.textContent = '▶ Смотреть';
}

function playScene(k) {
  show(k);
  const s = SCENES[k];
  if (audio) { audio.pause(); audio = null; }
  audio = new Audio(s.audio);
  audio.muted = muted;
  audio.play().catch(() => {});
  timer = setTimeout(() => {
    if (k + 1 < SCENES.length) playScene(k + 1);
    else stopPlay();
  }, s.dur * 1000);
}

btnPlay.addEventListener('click', () => {
  if (playing) { stopPlay(); return; }
  playing = true;
  btnPlay.textContent = '⏸ Пауза';
  document.getElementById('hint').textContent =
    'Идёт показ. Кнопка «Пауза» остановит, «Дальше» перелистнёт сцену.';
  playScene(i === SCENES.length - 1 ? 0 : i);
});

btnPrev.addEventListener('click', () => { stopPlay(); show(i - 1); });
btnNext.addEventListener('click', () => { stopPlay(); show(i + 1); });
btnSnd.addEventListener('click', () => {
  muted = !muted;
  if (audio) audio.muted = muted;
  btnSnd.textContent = muted ? '🔇 Без звука' : '🔊 Звук';
  btnSnd.setAttribute('aria-pressed', String(!muted));
  btnSnd.setAttribute('aria-label', muted ? 'Включить звук' : 'Выключить звук');
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stopPlay(); show(i + 1); }
  if (e.key === 'ArrowLeft')  { stopPlay(); show(i - 1); }
  if (e.key === ' ') { e.preventDefault(); btnPlay.click(); }
});

// прямая ссылка на сцену: index.html#scene-7
function fromHash() {
  const m = /scene-(\d+)/.exec(location.hash || '');
  if (m) show(parseInt(m[1], 10) - 1);
}
window.addEventListener('hashchange', () => { stopPlay(); fromHash(); });
fromHash();
show(i);
</script>
